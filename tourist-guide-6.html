<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>راهنمای سفر | مکان مناسب برای سفرت را پیدا کن</title>

<style>
  :root{
    --bg:#F6EFE2;
    --surface:#FFFDF8;
    --surface-2:#EFE6D2;
    --ink:#211F19;
    --muted:#7A6F5C;
    --line:#E3D8C0;
    --primary:#0F6E6A;
    --primary-dark:#0A4F4C;
    --primary-tint:#DCEEEC;
    --gold:#D9A441;
    --gold-tint:#F6E9CE;
    --brick:#A63D2F;
    --radius-lg:22px;
    --radius-md:16px;
    --shadow-card:0 10px 30px -14px rgba(33,31,25,.28);
    --shadow-soft:0 4px 16px -8px rgba(33,31,25,.2);
    --max-w:1120px;
    --header-h:64px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Vazirmatn', sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; background:none; border:none; cursor:pointer;}
  ul{margin:0; padding:0; list-style:none;}
  fieldset{border:none; margin:0; padding:0;}
  legend{padding:0;}
  input{accent-color:var(--primary); font-family:inherit;}
  ::selection{background:var(--gold-tint); color:var(--primary-dark);}
  :focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* ---------------- Header / Nav ---------------- */
  .topbar{
    position:sticky; top:0; z-index:50; height:var(--header-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 18px;
    background:rgba(246,239,226,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:17px;}
  .brand-mark{
    width:32px; height:32px; border-radius:9px; flex:none;
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    display:flex; align-items:center; justify-content:center; color:var(--gold-tint);
  }
  .brand-mark svg{width:18px; height:18px;}
  .nav-desktop{display:none; align-items:center; gap:28px;}
  .nav-desktop a{font-size:14px; font-weight:700; color:var(--ink); padding:8px 4px; position:relative;}
  .nav-desktop a:hover{color:var(--primary-dark);}
  .nav-desktop a.cta{
    background:var(--primary); color:#fff; padding:9px 18px; border-radius:999px;
  }
  .menu-toggle{
    display:flex; width:38px; height:38px; align-items:center; justify-content:center;
    border-radius:10px; color:var(--ink);
  }
  .menu-toggle svg{width:22px; height:22px;}
  .mobile-nav{
    max-height:0; overflow:hidden; background:var(--surface);
    border-bottom:1px solid var(--line);
    transition:max-height .25s ease;
  }
  .mobile-nav.open{max-height:260px;}
  .mobile-nav ul{padding:8px 14px 14px; display:grid; gap:4px;}
  .mobile-nav a{
    display:block; padding:12px 10px; border-radius:10px; font-weight:700; font-size:15px;
  }
  .mobile-nav a:hover{background:var(--surface-2);}
  @media(min-width:840px){
    .nav-desktop{display:flex;}
    .menu-toggle, .mobile-nav{display:none;}
  }

  /* ---------------- Layout ---------------- */
  #app{max-width:var(--max-w); margin:0 auto; padding:0 16px 20px;}
  .section{padding:30px 0 6px;}
  .section-title{font-size:20px; font-weight:800; margin:0 0 16px;}
  .link{font-size:13px; font-weight:700; color:var(--primary-dark); white-space:nowrap;}

  /* ---------------- Hero ---------------- */
  .hero{
    position:relative; margin:0 -16px; height:min(72vh, 560px); min-height:400px;
    display:flex; align-items:flex-end; overflow:hidden;
  }
  .hero-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .hero-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,40,38,.35) 0%, rgba(8,25,23,.75) 85%);
  }
  .hero-content{position:relative; z-index:1; padding:0 22px 40px; color:#fff; width:100%; max-width:640px;}
  .hero-content h1{font-size:clamp(26px, 5.5vw, 40px); font-weight:900; line-height:1.35; margin:0 0 12px;}
  .hero-content p{font-size:15px; opacity:.92; margin:0 0 22px; max-width:480px;}
  .hero-actions{display:flex; flex-wrap:wrap; gap:10px;}

  /* ---------------- Buttons ---------------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-weight:700; font-size:14.5px; cursor:pointer;
    border:none; border-radius:999px; padding:13px 22px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn svg{width:18px; height:18px; flex:none;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary); color:#fff; box-shadow:var(--shadow-soft);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-outline{background:var(--surface); color:var(--primary-dark); border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--primary);}
  .btn-outline-light{background:rgba(255,255,255,.12); color:#fff; border:1.5px solid rgba(255,255,255,.6); backdrop-filter:blur(4px);}
  .btn-outline-light:hover{background:rgba(255,255,255,.2);}
  .btn-lg{padding:15px 24px; font-size:15.5px;}
  .btn-sm{padding:9px 16px; font-size:13px; width:100%;}
  .btn-block{width:100%;}

  /* ---------------- Category cards (image-based) ---------------- */
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(min-width:620px){ .cat-grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:960px){ .cat-grid{grid-template-columns:repeat(5,1fr);} }
  .cat-card{
    display:block; border-radius:var(--radius-lg); overflow:hidden;
    background:var(--surface); box-shadow:var(--shadow-card); border:1px solid var(--line);
    transition:transform .18s ease;
  }
  .cat-card:hover{transform:translateY(-3px);}
  .cat-card-media{position:relative; aspect-ratio:4/3; background:var(--surface-2);}
  .cat-card-media img{width:100%; height:100%; object-fit:cover;}
  .cat-card-icon{
    position:absolute; bottom:8px; inset-inline-start:8px;
    width:34px; height:34px; border-radius:10px;
    background:rgba(255,253,248,.92); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
  }
  .cat-card-icon svg{width:18px; height:18px;}
  .cat-card-body{padding:12px 14px 14px;}
  .cat-card-body h3{margin:0 0 4px; font-size:15px; font-weight:800;}

  /* ---------------- Place cards / grid ---------------- */
  .grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:620px){ .grid{grid-template-columns:1fr 1fr;} }
  @media(min-width:960px){ .grid{grid-template-columns:1fr 1fr 1fr;} }

  .card{
    display:block; background:var(--surface); border-radius:var(--radius-lg);
    overflow:hidden; box-shadow:var(--shadow-card); border:1px solid var(--line);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 16px 34px -14px rgba(33,31,25,.32);}
  .card-media{position:relative; aspect-ratio:4/3; background:var(--surface-2); overflow:hidden;}
  .card-media img{width:100%; height:100%; object-fit:cover;}
  .card-tag{
    position:absolute; top:10px; inset-inline-start:10px;
    display:flex; align-items:center; gap:5px;
    background:rgba(255,253,248,.92); color:var(--primary-dark);
    font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:999px;
  }
  .card-tag svg{width:13px; height:13px;}
  .card-body{padding:14px 16px 16px;}
  .card-body h3{margin:0 0 6px; font-size:16px; font-weight:800;}
  .card-body p{margin:0 0 14px; font-size:13.5px; color:var(--muted);}
  .card-body p.reason{color:var(--primary-dark); font-weight:600;}

  .inline-empty{
    grid-column:1/-1; text-align:center; padding:40px 16px; color:var(--muted); font-size:14px;
    background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius-md);
  }

  /* ---------------- Search box ---------------- */
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1.5px solid var(--line); border-radius:999px;
    padding:12px 16px; margin-bottom:20px;
  }
  .search-box svg{width:18px; height:18px; color:var(--muted); flex:none;}
  .search-box input{
    border:none; outline:none; background:transparent; width:100%; font-size:14.5px; color:var(--ink);
  }

  /* ---------------- Page head ---------------- */
  .page-head{display:flex; align-items:flex-start; gap:12px; padding:20px 0 4px;}
  .page-head h1{margin:2px 0 4px; font-size:22px; font-weight:900; color:var(--primary-dark);}
  .page-head p{margin:0; color:var(--muted); font-size:13.5px;}
  .back-btn{
    flex:none; width:38px; height:38px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--ink);
    box-shadow:var(--shadow-soft);
  }
  .back-btn svg{width:18px; height:18px; transform:scaleX(-1);}
  .back-btn.floating{position:absolute; top:14px; inset-inline-start:14px; z-index:5; background:rgba(255,253,248,.92);}

  /* ---------------- Detail page ---------------- */
  .detail{position:relative;}
  .detail-hero{
    margin:0 -16px; aspect-ratio:16/10; background:var(--surface-2); overflow:hidden;
  }
  .detail-hero img{width:100%; height:100%; object-fit:cover;}
  @media(min-width:620px){ .detail-hero{margin:0; border-radius:var(--radius-lg); aspect-ratio:16/8;} }

  .detail-body{padding-top:22px;}
  .detail-body h1{font-size:25px; font-weight:900; margin:10px 0 8px; color:var(--primary-dark);}
  .desc{font-size:15px; margin:0 0 6px;}
  .sub-title{font-size:16px; font-weight:800; margin:22px 0 12px;}
  .chip.small{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
    background:var(--primary-tint); color:var(--primary-dark); font-size:12.5px; font-weight:700;
  }
  .chip.small svg{width:15px; height:15px;}
  .feature-list{display:grid; gap:9px;}
  .feature-list li{position:relative; padding-inline-start:22px; font-size:14px;}
  .feature-list li::before{
    content:""; position:absolute; inset-inline-start:0; top:8px;
    width:8px; height:8px; background:var(--gold); border-radius:2px; transform:rotate(45deg);
  }
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .info-item{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px;
  }
  .info-item svg{width:19px; height:19px; color:var(--primary); flex:none; margin-top:2px;}
  .info-item b{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:2px;}
  .info-item span{font-size:13.5px; font-weight:600;}

  /* ---------------- Suggest form ---------------- */
  .suggest-form{display:grid; gap:26px;}
  .q-block legend{font-size:15px; font-weight:800; margin-bottom:12px;}
  .option-row{display:flex; flex-wrap:wrap; gap:9px;}
  .option-pill{position:relative; cursor:pointer;}
  .option-pill input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;}
  .option-pill span{
    display:inline-flex; padding:11px 18px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--surface);
    font-size:13.5px; font-weight:700; color:var(--ink);
    transition:all .15s ease;
  }
  .option-pill input:checked + span{background:var(--primary); border-color:var(--primary); color:#fff;}
  .option-pill input:focus-visible + span{outline:3px solid var(--gold); outline-offset:2px;}

  /* ---------------- State screens ---------------- */
  .state-screen{
    min-height:48vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:40px 20px;
  }
  .state-screen h2{margin:6px 0 0; font-size:18px; font-weight:800;}
  .state-screen p{margin:0; color:var(--muted); font-size:14px; max-width:320px;}
  .state-screen .btn{margin-top:12px;}
  .state-icon{
    width:56px; height:56px; border-radius:16px; background:var(--primary-tint); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
  }
  .state-icon svg{width:26px; height:26px;}
  .state-icon.warn{background:#F7E3DD; color:var(--brick);}
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3.5px solid var(--primary-tint); border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .img-fallback{object-fit:contain !important; padding:20px; background:var(--surface-2);}

  /* ---------------- Footer ---------------- */
  footer.site-footer{
    border-top:1px solid var(--line); margin-top:20px; padding:30px 18px 40px;
    background:var(--surface);
  }
  .footer-inner{max-width:var(--max-w); margin:0 auto; display:grid; gap:16px; text-align:center;}
  .footer-inner h4{margin:0; font-size:15px; font-weight:800; color:var(--primary-dark);}
  .footer-inner p{margin:0; color:var(--muted); font-size:13px;}
  .footer-links{display:flex; justify-content:center; gap:20px; flex-wrap:wrap;}
  .footer-links a{font-size:13px; font-weight:700; color:var(--ink);}
  .footer-links a:hover{color:var(--primary-dark);}
</style>
</head>

  // نسخه نمو: داده‌ها به‌صورت محلی در همین فایل embed شده‌اند تا سایت
  // بدون نیاز به سرور (حتی با دابل‌کلیک روی index.html) اجرا شود.
  // برای اتصال به دیتابیس واقعی در آینده، همین تابع را با یک fetch به API واقعی جایگزین کنید.
  const root = document.getElementById("app");
  root.innerHTML = loadingView();
  try {
    const data = EMBEDDED_DATA;
    if (!data || !data.categories || !data.places) throw new Error("no data");
    state.categories = data.categories;
    state.places = data.places;
    state.loaded = true;
    router();
  } catch (err) {
    root.innerHTML = errorView("loadData()");
  }
}

function loadingView() {
  return `
    <div class="state-screen">
      <div class="spinner" aria-hidden="true"></div>
      <p>در حال بارگذاری مکان‌ها…</p>
    </div>`;
}

function errorView(retryFn) {
  return `
    <div class="state-screen">
      <div class="state-icon warn">${ICONS.refresh}</div>
      <h2>دریافت اطلاعات با مشکل مواجه شد.</h2>
      <p>دوباره تلاش کنید.</p>
      <button class="btn btn-primary" onclick="${retryFn}">تلاش دوباره</button>
    </div>`;
}

function emptyView(message, actionLabel, actionFn) {
  return `
    <div class="state-screen">
      <div class="state-icon">${ICONS.search}</div>
      <h2>${message}</h2>
      ${actionLabel ? `<button class="btn btn-primary" onclick="${actionFn}">${actionLabel}</button>` : ""}
    </div>`;
}

/* ---------------------------- روتر ---------------------------- */
window.addEventListener("hashchange", () => {
  closeMobileMenu();
  router();
});
window.addEventListener("DOMContentLoaded", () => {
  loadData();
  document.getElementById("menuToggle").addEventListener("click", toggleMobileMenu);
});

function toggleMobileMenu() {
  document.getElementById("mobileNav").classList.toggle("open");
  const btn = document.getElementById("menuToggle");
  const isOpen = document.getElementById("mobileNav").classList.contains("open");
  btn.innerHTML = isOpen ? ICONS.close : ICONS.menu;
}
function closeMobileMenu() {
  document.getElementById("mobileNav").classList.remove("open");
  document.getElementById("menuToggle").innerHTML = ICONS.menu;
}

function parseHash() {
  const hash = location.hash.replace(/^#\/?/, "");
  return hash.split("/").filter(Boolean);
}

function router() {
  if (!state.loaded) return;
  const parts = parseHash();
  const root = document.getElementById("app");
  window.scrollTo(0, 0);

  if (parts.length === 0) {
    root.innerHTML = renderHome();
  } else if (parts[0] === "categories") {
    root.innerHTML = renderCategoryList();
  } else if (parts[0] === "category" && parts[1]) {
    root.innerHTML = renderPlacesByCategory(parts[1]);
  } else if (parts[0] === "suggest" && parts[1] === "results") {
    root.innerHTML = renderSuggestResults();
  } else if (parts[0] === "suggest") {
    root.innerHTML = renderSuggestForm();
  } else if (parts[0] === "place" && parts[1]) {
    root.innerHTML = renderPlaceDetails(parts[1]);
  } else {
    root.innerHTML = emptyView("این صفحه پیدا نشد.", "بازگشت به صفحه اصلی", "location.hash='#/'");
  }
  attachImgFallback(root);
  attachSearchHandler(root);
}

function attachImgFallback(root) {
  root.querySelectorAll("img[data-src]").forEach((img) => {
    img.src = img.getAttribute("data-src");
    img.onerror = () => {
      img.onerror = null;
      img.src = FALLBACK_IMG;
      img.classList.add("img-fallback");
    };
  });
}

function attachSearchHandler(root) {
  const input = root.querySelector("#searchInput");
  if (!input) return;
  input.addEventListener("input", () => {
    const term = input.value.trim().toLowerCase();
    const grid = root.querySelector("#searchResultGrid");
    const catId = input.dataset.category;
    const all = placesInCategory(catId);
    const filtered = term ? all.filter((p) => p.name.toLowerCase().includes(term)) : all;
    grid.innerHTML = filtered.length
      ? filtered.map((p) => placeCard(p)).join("")
      : `<div class="inline-empty">مکانی با این مشخصات پیدا نشد.</div>`;
    attachImgFallback(grid);
  });
}

/* ---------------------------- کمکی‌ها ---------------------------- */
function getCategory(id) {
  return state.categories.find((c) => c.id === id);
}
function getPlace(id) {
  return state.places.find((p) => p.id === id);
}
function placesInCategory(id) {
  return state.places.filter((p) => p.category === id);
}
function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function placeCard(place) {
  const cat = getCategory(place.category);
  return `
    <a class="card" href="#/place/${place.id}" aria-label="${place.name}">
      <div class="card-media">
        <img data-src="${place.image}" alt="${place.name}" loading="lazy" />
        <span class="card-tag">${ICONS[cat?.icon] || ""}<b>${cat?.name || ""}</b></span>
      </div>
      <div class="card-body">
        <h3>${place.name}</h3>
        <p>${place.description}</p>
        <span class="btn btn-outline btn-sm">مشاهده جزئیات</span>
      </div>
    </a>`;
}

/* ---------------------------- صفحه اصلی ---------------------------- */
function renderHome() {
  const highlights = shuffle(state.places).slice(0, 6);
  return `
    <section class="hero">
      <img class="hero-bg" data-src="https://picsum.photos/seed/travelhero/1600/900" alt="مکان گردشگری" />
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1>مکان مناسب برای سفر بعدی‌ات را پیدا کن</h1>
        <p>مکان‌های دیدنی را سریع پیدا کن، اطلاعاتشان را ببین و بهترین گزینه را برای سفر انتخاب کن.</p>
        <div class="hero-actions">
          <a class="btn btn-primary btn-lg" href="#/categories">${ICONS.compass}کشف مکان‌ها</a>
          <a class="btn btn-outline-light btn-lg" href="#/suggest">${ICONS.sparkle}پیشنهاد برای من</a>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">چه نوع مکانی دوست داری؟</h2>
      <div class="cat-grid">
        ${state.categories
          .map(
            (c) => `
          <a class="cat-card" href="#/category/${c.id}">
            <div class="cat-card-media">
              <img data-src="${c.image}" alt="${c.name}" loading="lazy" />
              <span class="cat-card-icon">${ICONS[c.icon] || ""}</span>
            </div>
            <div class="cat-card-body">
              <h3>${c.name}</h3>
              <span class="link">مشاهده مکان‌ها ←</span>
            </div>
          </a>`
          )
          .join("")}
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">مکان‌های پیشنهادی</h2>
      <div class="grid">
        ${highlights.map((p) => placeCard(p)).join("")}
      </div>
    </section>
  `;
}

/* ---------------------------- فهرست دسته‌بندی‌ها ---------------------------- */
function renderCategoryList() {
  return `
    <section class="page-head">
      <a class="back-btn" href="#/">${ICONS.back}</a>
      <div><h1>دسته‌بندی‌ها</h1><p>یک دسته را انتخاب کن تا مکان‌های مرتبط را ببینی.</p></div>
    </section>
    <section class="section">
      <div class="cat-grid">
        ${state.categories
          .map(
            (c) => `
          <a class="cat-card" href="#/category/${c.id}">
            <div class="cat-card-media">
              <img data-src="${c.image}" alt="${c.name}" loading="lazy" />
              <span class="cat-card-icon">${ICONS[c.icon] || ""}</span>
            </div>
            <div class="cat-card-body">
              <h3>${c.name}</h3>
              <span class="link">مشاهده مکان‌ها ←</span>
            </div>
          </a>`
          )
          .join("")}
      </div>
    </section>
  `;
}

/* ---------------------------- مکان‌های یک دسته + جست‌وجو ---------------------------- */
function renderPlacesByCategory(catId) {
  const cat = getCategory(catId);
  if (!cat) {
    return emptyView("این دسته‌بندی پیدا نشد.", "بازگشت به دسته‌بندی‌ها", "location.hash='#/categories'");
  }
  const places = placesInCategory(catId);
  return `
    <section class="page-head">
      <a class="back-btn" href="#/categories">${ICONS.back}</a>
      <div><h1>مکان‌های ${cat.adjective}</h1><p>${places.length} مکان در این دسته‌بندی</p></div>
    </section>
    <section class="section">
      <div class="search-box">
        ${ICONS.search}
        <input id="searchInput" data-category="${catId}" type="text" placeholder="جست‌وجوی نام مکان…" />
      </div>
      <div class="grid" id="searchResultGrid">
        ${
          places.length
            ? places.map((p) => placeCard(p)).join("")
            : `<div class="inline-empty">مکانی با این مشخصات پیدا نشد.</div>`
        }
      </div>
    </section>
  `;
}

/* ---------------------------- جزئیات مکان ---------------------------- */
function renderPlaceDetails(id) {
  const place = getPlace(id);
  if (!place) {
    return emptyView("این مکان پیدا نشد.", "بازگشت به صفحه اصلی", "location.hash='#/'");
  }
  const cat = getCategory(place.category);
  return `
    <section class="detail">
      <a class="back-btn floating" href="javascript:history.back()">${ICONS.back}</a>
      <div class="detail-hero">
        <img data-src="${place.image}" alt="${place.name}" />
      </div>
      <div class="detail-body">
        <span class="chip small">${ICONS[cat?.icon] || ""}${cat?.name || ""}</span>
        <h1>${place.name}</h1>
        <p class="desc">${place.description}</p>

        <h2 class="sub-title">ویژگی‌های مکان</h2>
        <ul class="feature-list">
          ${place.features.map((f) => `<li>${f}</li>`).join("")}
        </ul>

        <h2 class="sub-title">اطلاعات تکمیلی</h2>
        <div class="info-grid">
          <div class="info-item">${ICONS.pin}<div><b>موقعیت</b><span>${place.info.location}</span></div></div>
          <div class="info-item">${ICONS.clock}<div><b>بهترین زمان</b><span>${place.info.bestTime}</span></div></div>
          <div class="info-item">${ICONS.compass}<div><b>مدت پیشنهادی</b><span>${place.durationLabel}</span></div></div>
          <div class="info-item">${ICONS.sparkle}<div><b>هزینه ورود</b><span>${place.info.entryFee}</span></div></div>
        </div>
      </div>
    </section>
  `;
}

/* ---------------------------- فرم «پیشنهاد برای من» ---------------------------- */
// دسته‌بندی‌ها فقط پس از بارگذاری داده مشخص می‌شوند، پس سؤال‌ها در زمان اجرا ساخته می‌شوند.
function buildQuestions() {
  return [
    {
      key: "category",
      label: "نوع مکان مورد علاقه",
      options: [...state.categories.map((c) => ({ value: c.id, label: c.name })), { value: "any", label: "فرقی نداره" }],
    },
    {
      key: "trip",
      label: "نوع سفر",
      options: [
        { value: "family", label: "خانوادگی" },
        { value: "friends", label: "دوستانه" },
        { value: "relax", label: "آرام و استراحت" },
        { value: "adventure", label: "ماجراجویی" },
        { value: "any", label: "فرقی نداره" },
      ],
    },
    {
      key: "duration",
      label: "میزان زمان سفر",
      options: [
        { value: "hours", label: "چند ساعت" },
        { value: "day", label: "یک روز" },
        { value: "multiday", label: "چند روز" },
        { value: "any", label: "فرقی نداره" },
      ],
    },
  ];
}

function renderSuggestForm() {
  const questions = buildQuestions();
  return `
    <section class="page-head">
      <a class="back-btn" href="#/">${ICONS.back}</a>
      <div><h1>مکان مناسب برای من</h1><p>چند سؤال کوتاه پاسخ بده تا بهترین گزینه‌ها را پیشنهاد بدهیم.</p></div>
    </section>
    <form class="section suggest-form" id="suggestForm" onsubmit="return submitSuggest(event)">
      ${questions
        .map(
          (q) => `
        <fieldset class="q-block">
          <legend>${q.label}</legend>
          <div class="option-row">
            ${q.options
              .map(
                (o) => `
              <label class="option-pill">
                <input type="radio" name="${q.key}" value="${o.value}" required />
                <span>${o.label}</span>
              </label>`
              )
              .join("")}
          </div>
        </fieldset>`
        )
        .join("")}
      <button type="submit" class="btn btn-primary btn-lg btn-block">${ICONS.sparkle}پیشنهاد مکان</button>
    </form>
  `;
}

function submitSuggest(e) {
  e.preventDefault();
  const form = e.target;
  const answers = {};
  buildQuestions().forEach((q) => {
    const checked = form.querySelector(`input[name="${q.key}"]:checked`);
    answers[q.key] = checked ? checked.value : "any";
  });
  state.answers = answers;
  location.hash = "#/suggest/results";
  return false;
}

function scorePlace(place, answers) {
  let score = 0;
  if (answers.category && answers.category !== "any" && place.category === answers.category) score += 3;
  if (answers.trip && answers.trip !== "any" && place.suitableFor.includes(answers.trip)) score += 3;
  if (answers.duration && answers.duration !== "any" && place.duration === answers.duration) score += 2;
  return score;
}

function reasonFor(place, answers) {
  const cat = getCategory(place.category);
  const parts = [];
  if (answers.category && answers.category !== "any" && place.category === answers.category) {
    parts.push(`علاقه شما به ${cat.name}`);
  }
  if (answers.trip && answers.trip !== "any" && place.suitableFor.includes(answers.trip)) {
    parts.push(`سفر ${TRIP_TYPE_LABELS[answers.trip]}`);
  }
  if (answers.duration && answers.duration !== "any" && place.duration === answers.duration) {
    parts.push(`زمان در دسترس شما (${DURATION_LABELS[answers.duration]})`);
  }
  if (parts.length === 0) {
    return "این مکان یکی از مکان‌های محبوب و مناسب برای سفر است.";
  }
  return `این مکان برای شما مناسب است چون با ${parts.join(" و ")} مطابقت دارد.`;
}

function suggestedCard(place, answers) {
  const cat = getCategory(place.category);
  return `
    <a class="card suggest-card" href="#/place/${place.id}" aria-label="${place.name}">
      <div class="card-media">
        <img data-src="${place.image}" alt="${place.name}" loading="lazy" />
        <span class="card-tag">${ICONS[cat?.icon] || ""}<b>${cat?.name || ""}</b></span>
      </div>
      <div class="card-body">
        <h3>${place.name}</h3>
        <p class="reason">${reasonFor(place, answers)}</p>
        <span class="btn btn-outline btn-sm">مشاهده جزئیات</span>
      </div>
    </a>`;
}

function renderSuggestResults() {
  const answers = state.answers;
  if (!answers || Object.keys(answers).length === 0) {
    return emptyView("هنوز فرم پیشنهاد را پر نکرده‌ای.", "رفتن به فرم پیشنهاد", "location.hash='#/suggest'");
  }

  const scored = state.places
    .map((p) => ({ place: p, score: scorePlace(p, answers) }))
    .sort((a, b) => b.score - a.score);

  const hasRealMatch = scored.some((x) => x.score > 0);
  const results = hasRealMatch ? scored.filter((x) => x.score > 0).slice(0, 6) : [];

  return `
    <section class="page-head">
      <a class="back-btn" href="#/suggest">${ICONS.back}</a>
      <div><h1>پیشنهادهای مناسب برای شما</h1></div>
    </section>
    <section class="section">
      ${
        results.length
          ? `<div class="grid">${results.map(({ place }) => suggestedCard(place, answers)).join("")}</div>`
          : emptyView("مکانی مطابق انتخاب شما پیدا نشد.", "تغییر شرایط", "location.hash='#/suggest'")
      }
    </section>
  `;
}

</script>
</body>
</html>
